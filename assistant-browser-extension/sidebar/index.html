<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Assistant Sidebar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <img src="../assets/icon-32.png" alt="icon" />
        <h1>Assistant</h1>
      </header>
      <main>
        <section id="conversation"></section>
        <form id="chat-form">
          <input id="prompt" placeholder="Ask about products, coupons, or travel…" />
          <button type="submit">Send</button>
        </form>
      </main>
      <footer>
        <button id="tab-products">Products</button>
        <button id="tab-coupons">Coupons</button>
        <button id="tab-travel">Travel</button>
      </footer>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
